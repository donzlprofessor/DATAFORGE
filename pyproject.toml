[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "dataforge"
version = "0.1.0"
description = "An offline CSV order ETL and data quality pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
dataforge = "dataforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dataforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
